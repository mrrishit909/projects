<!doctype html>
<html lang="en" class="grabbable boot">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Analyst projects by Rishit Raj Mathur, each with a step-by-step build log.">
<title>Projects · Rishit Mathur</title>
<link rel="preload" as="font" type="font/woff2" href="vendor/fonts/Geist-Medium.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="vendor/fonts/Geist-Regular.woff2" crossorigin>
<link rel="modulepreload" href="vendor/three.module.min.js">
<link rel="modulepreload" href="home.js">
<script>
/* Hold the Full list back while the carousel boots, so it doesn't flash; give up (and show it) if that takes too long. */
if (location.hash !== "#full" && !matchMedia("(prefers-reduced-motion: reduce)").matches) setTimeout(function () { document.documentElement.classList.remove("boot"); }, 6000);
else document.documentElement.classList.remove("boot");
</script>
<style>
@font-face{font-family:Geist;font-weight:400;font-style:normal;font-display:swap;src:url(vendor/fonts/Geist-Regular.woff2) format("woff2")}
@font-face{font-family:Geist;font-weight:500;font-style:normal;font-display:swap;src:url(vendor/fonts/Geist-Medium.woff2) format("woff2")}

/* Opening a project fades this page out and the next one in (browsers without cross-document view transitions just cut) */
@view-transition{navigation:auto}
::view-transition-old(root){animation:vt-out .35s cubic-bezier(.23,1,.32,1) both}
::view-transition-new(root){animation:vt-in .6s cubic-bezier(.23,1,.32,1) both}
@keyframes vt-out{to{opacity:0}}
@keyframes vt-in{from{opacity:0}}

/* The whole page is sized in rem, and rem follows the viewport width (1rem = 10px at 1500px wide, 10px at 390px on a phone),
   so every size below scales together. */
:root{--size:390;--ease:cubic-bezier(.23,1,.32,1);--dim:#7d7d7a}
@media(min-width:650px){:root{--size:1500}}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:clamp(5px,20px,10 * 100vw / var(--size));-webkit-text-size-adjust:none;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;background:#000;color-scheme:dark}
body{background:#000;color:#fff;font-family:Geist,"Helvetica Neue",Arial,sans-serif;font-size:1.4rem;font-weight:400;line-height:1.4;min-height:100%}
a{text-decoration:none;color:inherit}
button{background:none;border:0;cursor:pointer;font:inherit;color:inherit}
:focus-visible{outline:1px solid #fff;outline-offset:4px}
.label{font-size:max(1rem,10px);font-weight:500;text-transform:uppercase}   /* = the reference at 1500px+; just never smaller than 10px */
.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

html.grabbable{cursor:grab}
html.grabbing,html.grabbing *{cursor:grabbing!important;-webkit-user-select:none!important;user-select:none!important}
html.featured-lock,html.featured-lock body{height:100%;overflow:hidden;touch-action:none;overscroll-behavior:none}
html.featured-lock body{position:fixed;inset:0;width:100%}

/* ---- the carousel: a WebGL layer that follows these boxes ---- */
#gl{position:fixed;inset:0;width:100%;height:100%;z-index:10;pointer-events:none;display:none}
html.gl #gl{display:block}
#row{position:fixed;inset:0;overflow:hidden}
.card{position:absolute;left:0;top:0;cursor:pointer;border-radius:2rem;will-change:transform}
.card:focus-within{outline:1px solid #fff;outline-offset:4px}
body.full #row{display:none}
@media(max-width:649.98px){.card{border-radius:1.5rem}}

/* ---- labels: real text for layout, hit areas and screen readers; WebGL draws the pixels so the swirl can bend them ---- */
html.gl [data-gl]{-webkit-text-fill-color:transparent}
.ui{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;justify-content:space-between;padding:2.5rem 4rem;pointer-events:none}
@media(min-width:650px){.ui{padding:4rem 8rem}}
.ui .row{display:flex;align-items:flex-start;justify-content:space-between}
.ui .row.bottom{align-items:flex-end}
.ui a,.ui button{display:block;position:relative;pointer-events:auto;cursor:pointer;transition:opacity .3s ease-out}
.ui a::before,.ui button::before{content:"";position:absolute;inset:-1.5rem}
.modes{display:flex;gap:.5rem;pointer-events:auto}
.modes button{transition:opacity .5s ease-out;opacity:.5}
.modes button[aria-pressed="true"]{opacity:1}
.modes .slash{pointer-events:none}
.links{display:flex;gap:1.6rem}
@media(hover:hover) and (pointer:fine){.ui a:hover,.ui button:hover{opacity:.6}.modes button:hover{opacity:1}}

/* ---- Profile panel ---- */
.panel{position:fixed;left:50%;top:50%;z-index:40;width:42rem;transform:translate(-50%,-50%);pointer-events:none}
@media(min-width:650px){.panel{width:60rem}}
.panel .inner{position:absolute;left:2rem;right:2rem;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;text-align:center}
.panel [data-gl]{opacity:0;transition:opacity .7s var(--ease) var(--d,0s)}
body[data-panel="profile"] .panel [data-gl]{opacity:1}
body[data-panel="profile"] .panel .stat{opacity:.6}
.panel .bio{font-size:1.4rem;line-height:1.4;letter-spacing:-.02em;max-width:35rem}
@media(min-width:650px){.panel .bio{max-width:45rem}}
.panel .stat{margin-top:2.5rem}
.panel ul{display:flex;list-style:none;flex-wrap:wrap;justify-content:center;gap:.8rem 2rem;margin-top:2.5rem}
@media(min-width:650px){.panel .stat,.panel ul{margin-top:3rem}}
.panel a{display:block;pointer-events:none}
body[data-panel="profile"] .panel a{pointer-events:auto}

/* ---- Full: every project by name (kept from the earlier version) ---- */
html.boot body.full #full{visibility:hidden}
#full{position:relative;z-index:20;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:110px 24px;transition:opacity .6s var(--ease)}
#full p.list{max-width:1120px;text-align:center;font-size:clamp(26px,3.3vw,46px);line-height:1.28;font-weight:400;letter-spacing:-.025em}
#full .item{display:inline-block;transition:opacity .25s ease,transform .35s cubic-bezier(.2,.7,.2,1)}
#full p.list:hover .item{opacity:.3}
#full p.list .item:hover,#full p.list .item:focus-visible{opacity:1;transform:skewX(-9deg)}
#full .sep{color:var(--dim);margin:0 .28em}
#cap{margin:28px 0 0;min-height:1em;font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
/* Featured mode keeps the list for screen readers and keyboards; tabbing into it switches to Full */
body.featured #full{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;padding:0;min-height:0;opacity:0}
#peek,#peekv{position:fixed;left:0;top:0;z-index:30;width:340px;aspect-ratio:16/10;object-fit:cover;border-radius:14px;pointer-events:none;opacity:0;will-change:transform;background:#101010}
body.featured #peek,body.featured #peekv{display:none}
@media(max-width:649.98px){#peek,#peekv{width:220px}}
@media (prefers-reduced-motion:reduce){#full .item{transition:none}}
</style>
</head>
<body class="full">
<canvas id="gl" aria-hidden="true"></canvas>
<main id="row" aria-label="Featured projects"></main>

<main id="full">
  <h1 class="sr">Projects</h1>
  <p class="list"><!--LIST--></p>
  <p id="cap" aria-hidden="true"></p>
</main>
<img id="peek" alt="">
<video id="peekv" muted loop playsinline tabindex="-1" aria-hidden="true"></video>
<p id="now" class="sr" aria-live="polite"></p>

<div class="ui" id="ui">
  <div class="row top">
    <a class="label" data-gl="text" href="https://mrrishit909.github.io/">Rishit Mathur</a>
    <button class="label" data-gl="text" id="btn-profile" type="button" aria-expanded="false" aria-controls="panel-profile">Profile</button>
  </div>
  <div class="row bottom">
    <nav class="label modes" id="modes" aria-label="Project views" hidden><button type="button" data-gl="text" id="m-featured" aria-pressed="false">Featured</button><span class="slash" data-gl="text" aria-hidden="true">/</span><button type="button" data-gl="text" id="m-full" aria-pressed="true">Full</button></nav>
    <div class="label links"><a data-gl="text" href="https://github.com/mrrishit909" target="_blank" rel="noopener">GitHub</a><a data-gl="text" href="https://mrrishit909.github.io/resume.pdf" target="_blank" rel="noopener">Resume</a></div>
  </div>
</div>

<div class="panel" id="panel-profile" role="dialog" aria-label="Profile" inert>
  <div class="inner">
    <p class="bio" data-gl="text" style="--d:.05s">Rishit Raj Mathur, data analyst. Every project here comes with the problem, a step-by-step log of how it was built, and what it found.</p>
    <p class="label stat" data-gl="text" style="--d:.12s">{{COUNT}} projects — {{KINDS}}</p>
    <ul>
      <li><a class="label" data-gl="text" style="--d:.19s" href="https://github.com/mrrishit909" target="_blank" rel="noopener">GitHub</a></li>
      <li><a class="label" data-gl="text" style="--d:.24s" href="https://mrrishit909.github.io/resume.pdf" target="_blank" rel="noopener">Resume</a></li>
    </ul>
  </div>
</div>

<script type="application/json" id="projects-data">/*PROJECTS*/[]</script>
<script type="module" src="home.js"></script>
</body>
</html>
